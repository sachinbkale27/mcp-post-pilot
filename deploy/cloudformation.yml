AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MCP Post Pilot - one EC2 instance running the whole stack with Docker Compose,
  ECR repositories for its images, and a least-privilege deploy policy for CI.

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >
      Amazon Linux 2023 AMI. Pinned at creation (deploy/provision.sh resolves the latest);
      changing it replaces the instance and its Postgres data.
  InstanceType:
    Type: String
    Default: t3.small
  AllowedCidr:
    Type: String
    Description: Who may open the web UIs (ports 80 and 8080), e.g. 203.0.113.7/32. 0.0.0.0/0 = everyone.
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  DeployerUserName:
    Type: String
    Default: github-actions-deployer
    Description: Existing IAM user whose access keys GitHub Actions uses.

Resources:
  # ------------------------------------------------------------- images
  BlogRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcp-post-pilot/blog
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules": [{"rulePriority": 1, "description": "Keep the 10 most recent images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
          "action": {"type": "expire"}}]}
  AgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcp-post-pilot/agent
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules": [{"rulePriority": 1, "description": "Keep the 10 most recent images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
          "action": {"type": "expire"}}]}
  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcp-post-pilot/web
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules": [{"rulePriority": 1, "description": "Keep the 10 most recent images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
          "action": {"type": "expire"}}]}

  # ----------------------------------------------------------- instance
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore        # SSM Run Command (no SSH)
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly  # pull images
      Policies:
        - PolicyName: read-app-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp-post-pilot
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp-post-pilot/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MCP Post Pilot web UIs (no SSH; administration is via SSM)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr, Description: Blog UI }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref AllowedCidr, Description: Agent chat UI }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: mcp-post-pilot }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p /opt/mcp-post-pilot

  PublicIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: mcp-post-pilot }

  # ------------------------------------------------- CI deploy permissions
  # Only what the GitHub Actions workflow needs on top of its ECR push access.
  DeployerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets GitHub Actions deploy MCP Post Pilot (and nothing else)
      Users: [!Ref DeployerUserName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadStackOutputs
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId
          - Sid: RunDeployOnThisInstance
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
              - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
          - Sid: ReadCommandResults
            Effect: Allow
            Action: [ssm:GetCommandInvocation, ssm:DescribeInstanceInformation]
            Resource: "*"
          - Sid: WriteAppParameters
            Effect: Allow
            Action: ssm:PutParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp-post-pilot/*

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref PublicIp
  RegistryUri:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
  BlogUrl:
    Value: !Sub http://${PublicIp}/
  ChatUrl:
    Value: !Sub http://${PublicIp}:8080/
