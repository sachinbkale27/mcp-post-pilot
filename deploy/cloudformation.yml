AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MCP Post Pilot (serverless) - CloudFront + S3 for the UIs, Lambda (container images
  with the Lambda Web Adapter) for the blog API, MCP server and agent, DynamoDB for
  data. Nothing runs, and almost nothing is billed, while it is idle.

Parameters:
  ImageTag:
    Type: String
    Default: ""
    Description: >
      Image tag (git SHA) for the Lambda functions, set by deploy/provision.sh. Empty on the
      very first run, which only creates the ECR repositories (and other image-free resources).
  AllowedCidrs:
    Type: CommaDelimitedList
    Description: IPv4 ranges allowed to use the site, e.g. 203.0.113.7/32. 0.0.0.0/0 = everyone.
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared secret CloudFront adds to API requests; the Lambdas reject requests without it.
  DeployerUserName:
    Type: String
    Default: github-actions-deployer
    Description: Existing IAM user whose access keys GitHub Actions uses.
  BlogDomain:
    Type: String
    Default: ""
    Description: Optional custom domain for the blog UI, e.g. blog.example.com.
  ChatDomain:
    Type: String
    Default: ""
    Description: Optional custom domain for the agent chat UI, e.g. chat.example.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone that holds both custom domains.
  CertificateArn:
    Type: String
    Default: ""
    Description: us-east-1 ACM certificate covering both domains (deploy/certificate.yml). Empty = no custom domains.

Conditions:
  HasImage: !Not [!Equals [!Ref ImageTag, ""]]
  HasDomains: !Not [!Equals [!Ref CertificateArn, ""]]
  HasImageAndDomains: !And [!Condition HasImage, !Condition HasDomains]

Resources:
  # ------------------------------------------------------------- images
  BlogRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcp-post-pilot/blog
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules": [{"rulePriority": 1, "description": "Keep the 10 most recent images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
          "action": {"type": "expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
  AgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcp-post-pilot/agent
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules": [{"rulePriority": 1, "description": "Keep the 10 most recent images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
          "action": {"type": "expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]

  # --------------------------------------------------------------- data
  PostsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # keep the posts even if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: N }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: thread_id, AttributeType: S }]
      KeySchema: [{ AttributeName: thread_id, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  # ---------------------------------------------------------- functions
  BlogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: posts-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan]
                Resource: !GetAtt PostsTable.Arn
        - PolicyName: upload-media
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${WebBucket.Arn}/media/*   # uploaded images, served by CloudFront

  McpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: read-settings   # OPENAI_API_KEY for generate_image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp-post-pilot

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: conversations-and-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt ConversationsTable.Arn
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp-post-pilot

  BlogFunction:
    Condition: HasImage
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mcp-post-pilot-blog
      PackageType: Image
      Code: { ImageUri: !Sub "${BlogRepository.RepositoryUri}:${ImageTag}" }
      Role: !GetAtt BlogRole.Arn
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          STORAGE_BACKEND: dynamodb
          POSTS_TABLE: !Ref PostsTable
          MEDIA_BUCKET: !Ref WebBucket
          ORIGIN_SECRET: !Ref OriginSecret
          AWS_LWA_PORT: "8100"
          AWS_LWA_READINESS_CHECK_PROTOCOL: tcp

  BlogFunctionUrl:
    Condition: HasImage
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !Ref BlogFunction, AuthType: NONE }

  McpFunction:
    Condition: HasImage
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mcp-post-pilot-mcp
      PackageType: Image
      Code: { ImageUri: !Sub "${BlogRepository.RepositoryUri}:${ImageTag}" }
      ImageConfig:
        Command: [python, mcp_server/server.py]
        WorkingDirectory: /app
      Role: !GetAtt McpRole.Arn
      MemorySize: 512
      Timeout: 150   # generate_image can take up to a minute
      Environment:
        Variables:
          MCP_HOST: 0.0.0.0
          MCP_PORT: "8101"
          MCP_STATELESS: "1"
          BLOG_API_URL: !GetAtt BlogFunctionUrl.FunctionUrl
          SSM_PARAMETER_PATH: /mcp-post-pilot
          ORIGIN_SECRET: !Ref OriginSecret
          AWS_LWA_PORT: "8101"
          AWS_LWA_READINESS_CHECK_PROTOCOL: tcp

  McpFunctionUrl:
    Condition: HasImage
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !Ref McpFunction, AuthType: NONE }

  AgentFunction:
    Condition: HasImage
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mcp-post-pilot-agent
      PackageType: Image
      Code: { ImageUri: !Sub "${AgentRepository.RepositoryUri}:${ImageTag}" }
      Role: !GetAtt AgentRole.Arn
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          CONVERSATION_BACKEND: dynamodb
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          SSM_PARAMETER_PATH: /mcp-post-pilot
          MCP_SERVER_URL: !Sub "${McpFunctionUrl.FunctionUrl}mcp"
          ORIGIN_SECRET: !Ref OriginSecret
          AWS_LWA_PORT: "8102"
          AWS_LWA_READINESS_CHECK_PROTOCOL: tcp
          AWS_LWA_INVOKE_MODE: response_stream   # SSE: send tokens as they are produced

  AgentFunctionUrl:
    Condition: HasImage
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !Ref AgentFunction, AuthType: NONE, InvokeMode: RESPONSE_STREAM }

  # Function URLs are public; the apps themselves reject calls without the origin secret.
  BlogUrlPermission:
    Condition: HasImage
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref BlogFunction, Action: lambda:InvokeFunctionUrl, Principal: "*", FunctionUrlAuthType: NONE }
  BlogInvokePermission:
    Condition: HasImage
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref BlogFunction, Action: lambda:InvokeFunction, Principal: "*", InvokedViaFunctionUrl: true }
  McpUrlPermission:
    Condition: HasImage
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref McpFunction, Action: lambda:InvokeFunctionUrl, Principal: "*", FunctionUrlAuthType: NONE }
  McpInvokePermission:
    Condition: HasImage
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref McpFunction, Action: lambda:InvokeFunction, Principal: "*", InvokedViaFunctionUrl: true }
  AgentUrlPermission:
    Condition: HasImage
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref AgentFunction, Action: lambda:InvokeFunctionUrl, Principal: "*", FunctionUrlAuthType: NONE }
  AgentInvokePermission:
    Condition: HasImage
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref AgentFunction, Action: lambda:InvokeFunction, Principal: "*", InvokedViaFunctionUrl: true }

  BlogLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/mcp-post-pilot-blog, RetentionInDays: 14 }
  McpLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/mcp-post-pilot-mcp, RetentionInDays: 14 }
  AgentLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/mcp-post-pilot-agent, RetentionInDays: 14 }

  # ------------------------------------------------------------ web / CDN
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Condition: HasImage
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # Runs on every request at the edge: IP allow-list, API path routing, SPA fallback
  # (on the chat domain, page routes serve the chat app).
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-viewer-request
      AutoPublish: true
      FunctionConfig:
        Comment: IP allow-list, /api prefix stripping, SPA routing
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var ALLOWED = ["${Cidrs}"];
          var CHAT_HOST = "${ChatHost}";

          function toInt(ip) {
            var p = ip.split(".");
            if (p.length !== 4) return null;
            return ((+p[0] << 24) >>> 0) + (+p[1] << 16) + (+p[2] << 8) + (+p[3]);
          }

          function allowed(ip) {
            var addr = toInt(ip);
            if (addr === null) return false;
            for (var i = 0; i < ALLOWED.length; i++) {
              var parts = ALLOWED[i].trim().split("/");
              var bits = +parts[1];
              var mask = bits === 0 ? 0 : (0xffffffff << (32 - bits)) >>> 0;
              if (((addr & mask) >>> 0) === ((toInt(parts[0]) & mask) >>> 0)) return true;
            }
            return false;
          }

          function handler(event) {
            var request = event.request;
            if (!allowed(event.viewer.ip)) {
              return { statusCode: 403, statusDescription: "Forbidden" };
            }
            var uri = request.uri;
            var host = request.headers.host ? request.headers.host.value : "";
            if (uri.indexOf("/api/blog/") === 0) {          // -> blog API Lambda
              request.uri = uri.substring(9);
            } else if (uri.indexOf("/api/agent/") === 0) {  // -> agent Lambda
              request.uri = uri.substring(10);
            } else if (uri.indexOf(".") === -1) {           // SPA routes -> index.html
              var chat = (CHAT_HOST !== "" && host === CHAT_HOST) || uri === "/chat" || uri.indexOf("/chat/") === 0;
              request.uri = chat ? "/chat/index.html" : "/index.html";
            }
            return request;
          }
        - Cidrs: !Join ['", "', !Ref AllowedCidrs]
          ChatHost: !Ref ChatDomain

  Distribution:
    Condition: HasImage
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: MCP Post Pilot
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: false              # the IP allow-list matches IPv4 addresses
        PriceClass: PriceClass_200      # includes India
        DefaultRootObject: index.html
        Aliases: !If [HasDomains, [!Ref BlogDomain, !Ref ChatDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomains
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: blog-api
            DomainName: !Select [2, !Split ["/", !GetAtt BlogFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginCustomHeaders: [{ HeaderName: x-origin-secret, HeaderValue: !Ref OriginSecret }]
          - Id: agent-api
            DomainName: !Select [2, !Split ["/", !GetAtt AgentFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60 }
            OriginCustomHeaders: [{ HeaderName: x-origin-secret, HeaderValue: !Ref OriginSecret }]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN }
        CacheBehaviors:
          - PathPattern: /api/blog/*
            TargetOriginId: blog-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - { EventType: viewer-request, FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN }
          - PathPattern: /api/agent/*
            TargetOriginId: agent-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: false               # don't buffer the SSE stream
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - { EventType: viewer-request, FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN }

  # Custom domains -> the distribution (Z2FDTNDATAQYW2 is CloudFront's fixed alias zone id).
  BlogDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasImageAndDomains
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref BlogDomain
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  ChatDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasImageAndDomains
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ChatDomain
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ------------------------------------------------- CI deploy permissions
  # Only what the GitHub Actions workflow needs on top of its ECR push access.
  DeployerPolicy:
    Condition: HasImage
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets GitHub Actions deploy MCP Post Pilot (and nothing else)
      Users: [!Ref DeployerUserName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadStackOutputs
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId
          - Sid: UpdateFunctions
            Effect: Allow
            Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
            Resource: [!GetAtt BlogFunction.Arn, !GetAtt McpFunction.Arn, !GetAtt AgentFunction.Arn]
          - Sid: UploadSite
            Effect: Allow
            Action: [s3:ListBucket]
            Resource: !GetAtt WebBucket.Arn
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub ${WebBucket.Arn}/*
          - Sid: InvalidateCache
            Effect: Allow
            Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
            Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: PullPublicBaseImages   # authenticated pulls from public.ecr.aws get higher limits
            Effect: Allow
            Action: [ecr-public:GetAuthorizationToken, sts:GetServiceBearerToken]
            Resource: "*"
          - Sid: WriteAppParameters
            Effect: Allow
            Action: ssm:PutParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp-post-pilot/*

Outputs:
  BlogUrl:
    Condition: HasImage
    Value: !If [HasDomains, !Sub "https://${BlogDomain}/", !Sub "https://${Distribution.DomainName}/"]
  ChatUrl:
    Condition: HasImage
    Value: !If [HasDomains, !Sub "https://${ChatDomain}/", !Sub "https://${Distribution.DomainName}/chat/"]
  CloudFrontUrl:
    Condition: HasImage
    Value: !Sub https://${Distribution.DomainName}/
  DistributionId:
    Condition: HasImage
    Value: !Ref Distribution
  WebBucket:
    Value: !Ref WebBucket
  RegistryUri:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
  BlogFunction:
    Condition: HasImage
    Value: !Ref BlogFunction
  McpFunction:
    Condition: HasImage
    Value: !Ref McpFunction
  AgentFunction:
    Condition: HasImage
    Value: !Ref AgentFunction
