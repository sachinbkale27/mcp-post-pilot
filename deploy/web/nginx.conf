# Blog UI on :80, agent chat UI on :8080. Each proxies /api/ to its backend,
# so the browser only talks to this server (no CORS, internal services stay private).

server {
    listen 80;
    root /usr/share/nginx/blog;

    location /api/ {
        proxy_pass http://blog-api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8080;
    root /usr/share/nginx/chat;

    location /api/ {
        proxy_pass http://agent-api:8102/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events: pass each event through immediately, keep long turns open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
