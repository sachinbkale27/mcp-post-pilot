name: Deploy to AWS

# Serverless deploy: build the two images, push to ECR, point the three Lambda
# functions at them, then upload both UIs to S3 and refresh CloudFront.
# Infrastructure is created separately with deploy/provision.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  STACK_NAME: mcp-post-pilot

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' --output text |
            while read -r key value; do echo "$key=$value" >> "$GITHUB_OUTPUT"; done

      - uses: aws-actions/amazon-ecr-login@v2

      # Anonymous pulls of the Lambda Web Adapter base image from public.ecr.aws are
      # rate limited (429 "Data limit exceeded"); authenticated pulls get a far higher limit.
      - name: Log in to ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.stack.outputs.RegistryUri }}
          TAG: ${{ github.sha }}
        run: |
          # --provenance=false: Lambda only accepts single-platform image manifests.
          docker build --provenance=false -t "$REGISTRY/mcp-post-pilot/blog:$TAG" blog-app
          docker build --provenance=false -t "$REGISTRY/mcp-post-pilot/agent:$TAG" agent-chat
          docker push --quiet "$REGISTRY/mcp-post-pilot/blog:$TAG"
          docker push --quiet "$REGISTRY/mcp-post-pilot/agent:$TAG"

      # Right after the first deploy/provision.sh run the functions do not exist yet: the
      # images pushed above are what provision.sh needs to create them.
      - name: Check for Lambda functions
        id: ready
        run: |
          if [ -n "${{ steps.stack.outputs.AgentFunction }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Images pushed. The Lambda functions don't exist yet - run deploy/provision.sh, then rerun this workflow."
          fi

      # API keys live in GitHub secrets; settings in GitHub variables (with defaults).
      # The agent Lambda reads them from Parameter Store when it starts.
      - name: Sync app settings to Parameter Store
        if: steps.ready.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-2024-11-20' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2.5-flare' }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'true' }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'mcp-blog-agent' }}
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
        run: |
          put() {  # name, type
            if [ -n "${!1}" ]; then
              aws ssm put-parameter --name "/mcp-post-pilot/$1" --type "$2" --value "${!1}" --overwrite >/dev/null
              echo "set /mcp-post-pilot/$1"
            fi
          }
          [ -n "$OPENAI_API_KEY" ] || echo "::warning::OPENAI_API_KEY secret is not set; keeping the value already in Parameter Store (if any)"
          put OPENAI_API_KEY SecureString
          put LANGSMITH_API_KEY SecureString
          put OPENAI_MODEL String
          put OPENAI_IMAGE_MODEL String
          put LANGSMITH_TRACING String
          put LANGSMITH_PROJECT String
          put LANGSMITH_ENDPOINT String

      - name: Update Lambda functions
        if: steps.ready.outputs.ready == 'true'
        env:
          REGISTRY: ${{ steps.stack.outputs.RegistryUri }}
          TAG: ${{ github.sha }}
        run: |
          # The MCP server runs from the blog image with a different command.
          update() {  # function, image
            aws lambda update-function-code --function-name "$1" \
              --image-uri "$REGISTRY/mcp-post-pilot/$2:$TAG" --query LastUpdateStatus --output text
          }
          update "${{ steps.stack.outputs.BlogFunction }}" blog
          update "${{ steps.stack.outputs.McpFunction }}" blog
          update "${{ steps.stack.outputs.AgentFunction }}" agent
          for fn in ${{ steps.stack.outputs.BlogFunction }} ${{ steps.stack.outputs.McpFunction }} ${{ steps.stack.outputs.AgentFunction }}; do
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn: $(aws lambda get-function-configuration --function-name "$fn" --query LastUpdateStatus --output text)"
          done

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Build UIs
        if: steps.ready.outputs.ready == 'true'
        run: |
          (cd blog-app/frontend && npm ci && VITE_API_URL=/api/blog VITE_CHAT_URL="${{ steps.stack.outputs.ChatUrl }}" npm run build)
          (cd agent-chat/frontend && npm ci && VITE_API_URL=/api/agent VITE_BLOG_API_URL=/api/blog VITE_BLOG_URL="${{ steps.stack.outputs.BlogUrl }}" npm run build -- --base /chat/)

      - name: Upload UIs and refresh CloudFront
        if: steps.ready.outputs.ready == 'true'
        env:
          BUCKET: ${{ steps.stack.outputs.WebBucket }}
          DISTRIBUTION: ${{ steps.stack.outputs.DistributionId }}
        run: |
          # Hashed assets can be cached forever; index.html must always be revalidated.
          # media/ holds uploaded images: never delete it during a deploy.
          aws s3 sync blog-app/frontend/dist "s3://$BUCKET/" --delete --exclude "chat/*" --exclude "media/*" \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 sync agent-chat/frontend/dist "s3://$BUCKET/chat/" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp blog-app/frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control no-cache
          aws s3 cp agent-chat/frontend/dist/index.html "s3://$BUCKET/chat/index.html" --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/index.html" "/chat/index.html" \
            --query Invalidation.Id --output text

      - name: Summary
        if: steps.ready.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::7}\`"
            echo "- Blog: ${{ steps.stack.outputs.BlogUrl }}"
            echo "- Agent chat: ${{ steps.stack.outputs.ChatUrl }}"
          } >> "$GITHUB_STEP_SUMMARY"
