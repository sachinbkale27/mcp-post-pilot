[project]
name = "agent-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai",
    "langchain-anthropic",  # the Image Annotation Agent, when ANTHROPIC_API_KEY is set
    "langsmith",
    "langgraph",
    "mcp",
    "pillow<13",  # 13.0 is too new to adopt yet
    "fastapi",
    "uvicorn[standard]",
    "boto3",
    "python-dotenv",
]
